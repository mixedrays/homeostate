name: Docs

# Builds apps/docs and deploys it to the `homeostate` Cloudflare Pages project. Only main is
# deployed (production): on every push to main and on a manual run from main. Pull requests
# only build, as a check; nothing is deployed for them.
#
# Needs the CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets and
# the SITE_URL variable, the production origin.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @homeostate/docs build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy build/client --project-name=homeostate --branch=main
